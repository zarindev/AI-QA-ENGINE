name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint + tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: browser-actions/setup-chrome@v1
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Secret check
        run: python scripts/check_secrets.py --all
      - name: Ruff
        run: ruff check backend scripts demo_targets
      - name: Black
        run: black --check backend scripts demo_targets
      - name: Mypy
        run: mypy backend/app
      - name: Tests (no API key — the Claude client is never called)
        env:
          ANTHROPIC_API_KEY: ""
        run: pytest backend/tests -q

  frontend:
    name: Frontend · typecheck + lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint src
      - run: npx vitest run
      - run: npm run build
