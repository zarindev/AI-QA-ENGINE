{% extends "layout.html" %}
{% block title %}Add car{% endblock %}
{% block heading %}Add car{% endblock %}
{% block content %}
<div class="card">{% for e in errors %}<div class="alert error" role="alert">{{ e }}</div>{% endfor %}
<form method="post" class="form">
<div class="row"><div><label for="make">Make</label><input id="make" name="make" value="{{ data.make }}" required></div>
<div><label for="model">Model</label><input id="model" name="model" value="{{ data.model }}" required></div></div>
<div class="row"><div><label for="plate">Plate</label><input id="plate" name="plate" value="{{ data.plate }}" required></div>
<div><label for="category">Category</label><select id="category" name="category">{% for c in ['Economy','Compact','SUV','Luxury','Van'] %}<option {{ 'selected' if data.category == c }}>{{ c }}</option>{% endfor %}</select></div></div>
<div class="row"><div><label for="daily_rate">Daily rate ($)</label><input id="daily_rate" name="daily_rate" type="number" step="0.01" value="{{ data.daily_rate }}" required></div>
<div><label for="seats">Seats</label><input id="seats" name="seats" type="number" min="2" max="9" value="{{ data.seats or 5 }}"></div></div>
<button class="btn primary" type="submit">Save car</button></form></div>
{% endblock %}
