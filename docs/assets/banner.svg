<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="QA Pilot — Give it a URL. It learns the app, writes the tests, runs them, and reports the bugs.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1C"/>
      <stop offset="0.6" stop-color="#0B1327"/>
      <stop offset="1" stop-color="#10204A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <ellipse cx="300" cy="200" rx="360" ry="260" fill="url(#glow)"/>
  <ellipse cx="1120" cy="60" rx="260" ry="160" fill="url(#glow)" opacity="0.5"/>

  <g transform="translate(150 120)">
    <rect width="160" height="160" rx="40" fill="url(#mark)"/>
    <path d="M45 85l22 22 48-52" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="115" cy="115" r="17" fill="#16A34A" stroke="#fff" stroke-width="7"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="370" y="190" fill="#FFFFFF" font-size="76" font-weight="800" letter-spacing="-2">QA Pilot</text>
    <text x="372" y="238" fill="#CBD5E1" font-size="25">Give it a URL. It learns the app, writes the tests,</text>
    <text x="372" y="272" fill="#CBD5E1" font-size="25">runs them, and reports the bugs.</text>
  </g>

  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="15">
    <g transform="translate(372 300)">
      <rect width="136" height="32" rx="16" fill="#16A34A" fill-opacity="0.16" stroke="#16A34A" stroke-opacity="0.5"/>
      <text x="68" y="21" fill="#4ADE80" text-anchor="middle">● 100% local</text>
    </g>
    <g transform="translate(516 300)">
      <rect width="176" height="32" rx="16" fill="#2563EB" fill-opacity="0.18" stroke="#3B82F6" stroke-opacity="0.5"/>
      <text x="88" y="21" fill="#93C5FD" text-anchor="middle">Selenium + Claude</text>
    </g>
    <g transform="translate(704 300)">
      <rect width="190" height="32" rx="16" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-opacity="0.5"/>
      <text x="95" y="21" fill="#FCD34D" text-anchor="middle">bugs with evidence</text>
    </g>
  </g>

  <g transform="translate(940 110)" font-family="'JetBrains Mono', Consolas, monospace" font-size="13">
    <rect width="250" height="180" rx="14" fill="#0F172A" stroke="#334155"/>
    <circle cx="20" cy="18" r="5" fill="#DC2626"/><circle cx="36" cy="18" r="5" fill="#F59E0B"/><circle cx="52" cy="18" r="5" fill="#16A34A"/>
    <text x="18" y="54" fill="#4ADE80">✓ TC-PAT-001 register</text>
    <text x="18" y="80" fill="#4ADE80">✓ TC-APP-004 book slot</text>
    <text x="18" y="106" fill="#F87171">✗ TC-BIL-002 coverage</text>
    <text x="36" y="132" fill="#F87171">BUG-003 critical 3/3</text>
    <text x="18" y="158" fill="#4ADE80">✓ TC-REP-001 403 ok</text>
  </g>
</svg>
