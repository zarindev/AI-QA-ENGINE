[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = [
    "browser: needs a local Google Chrome (skipped automatically when Chrome is missing)",
    "network: needs internet access to public practice sites",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend"]
extend-exclude = ["backend/app/static", "frontend", "demo_targets/*/static"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 110
target-version = ["py311"]
# Demo apps are kept compact on purpose (planted-bug markers sit next to the code they describe).
extend-exclude = "demo_targets/"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
